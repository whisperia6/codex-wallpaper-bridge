<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src http://127.0.0.1:*; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="dark" />
    <title>Lumina</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="desktop-titlebar" id="desktopTitlebar" hidden>
      <div class="desktop-titlebar__brand">
        <svg class="desktop-titlebar__mark" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9" />
          <circle cx="12" cy="12" r="2.5" />
        </svg>
        <span>Lumina</span>
      </div>
      <span class="desktop-titlebar__connection" id="desktopConnectionStatus" data-state="connecting" role="status">正在连接本地服务</span>
    </header>
    <main class="desktop-shell">
      <div class="control-placeholder" id="controlPlaceholder" aria-live="polite">
        <span class="control-placeholder__spinner" aria-hidden="true"></span>
        <strong>正在启动壁纸工作台</strong>
        <p>首次扫描 Wallpaper Engine 项目可能需要几秒。</p>
      </div>
      <iframe
        id="controlFrame"
        title="Lumina 壁纸设置"
        sandbox="allow-scripts allow-same-origin allow-forms"
        allow="autoplay"
        referrerpolicy="no-referrer"
      ></iframe>
    </main>
    <script type="module" src="renderer-desktop.mjs"></script>
  </body>
</html>
