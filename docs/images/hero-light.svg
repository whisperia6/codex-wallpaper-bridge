<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Lumina — Dynamic Wallpaper &amp; Liquid Glass Workbench">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="52%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <radialGradient id="orbL1" cx="20%" cy="25%" r="48%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbL2" cx="80%" cy="22%" r="44%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#ec4899" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbL3" cx="60%" cy="88%" r="48%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#06b6d4" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassCardL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.56"/>
    </linearGradient>
    <linearGradient id="logoBgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <clipPath id="frameClipL">
      <rect x="0" y="0" width="1200" height="340" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClipL)">
    <rect width="1200" height="340" fill="url(#bgL)"/>
    <rect width="1200" height="340" fill="url(#orbL1)"/>
    <rect width="1200" height="340" fill="url(#orbL2)"/>
    <rect width="1200" height="340" fill="url(#orbL3)"/>

    <g stroke="#0f172a" stroke-opacity="0.04" stroke-width="1">
      <line x1="0" y1="85" x2="1200" y2="85"/>
      <line x1="0" y1="170" x2="1200" y2="170"/>
      <line x1="0" y1="255" x2="1200" y2="255"/>
      <line x1="300" y1="0" x2="300" y2="340"/>
      <line x1="600" y1="0" x2="600" y2="340"/>
      <line x1="900" y1="0" x2="900" y2="340"/>
    </g>

    <rect x="76" y="38" width="1048" height="264" rx="20" fill="url(#glassCardL)" stroke="#0f172a" stroke-opacity="0.09" stroke-width="1.2"/>
    <line x1="120" y1="39.5" x2="1080" y2="39.5" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.2"/>

    <g transform="translate(566, 66)">
      <rect x="0" y="0" width="68" height="68" rx="18" fill="url(#logoBgL)"/>
      <g transform="translate(14, 14)" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" fill="none">
        <circle cx="20" cy="20" r="4.2" fill="#ffffff" stroke="none"/>
        <line x1="20" y1="5" x2="20" y2="12.5"/>
        <line x1="20" y1="27.5" x2="20" y2="35"/>
        <line x1="7" y1="12.5" x2="13.5" y2="16.2"/>
        <line x1="26.5" y1="23.8" x2="33" y2="27.5"/>
        <line x1="7" y1="27.5" x2="13.5" y2="23.8"/>
        <line x1="26.5" y1="16.2" x2="33" y2="12.5"/>
      </g>
    </g>

    <text x="600" y="186" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="52" font-weight="750" letter-spacing="2.5" fill="#0f172a">Lumina</text>
    <text x="600" y="220" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="17" font-weight="450" letter-spacing="0.4" fill="#475569">为 Windows 上的 Codex 与 Antigravity 桌面版换上动态壁纸与液态玻璃</text>

    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="12.5" font-weight="500" fill="#1e293b">
      <rect x="226" y="246" width="164" height="30" rx="15" fill="#0f172a" fill-opacity="0.05" stroke="#0f172a" stroke-opacity="0.10"/>
      <text x="308" y="265.5" text-anchor="middle">WebWallGL 3.1.0 场景</text>

      <rect x="404" y="246" width="176" height="30" rx="15" fill="#0f172a" fill-opacity="0.05" stroke="#0f172a" stroke-opacity="0.10"/>
      <text x="492" y="265.5" text-anchor="middle">双宿主全局液态玻璃</text>

      <rect x="594" y="246" width="176" height="30" rx="15" fill="#0f172a" fill-opacity="0.05" stroke="#0f172a" stroke-opacity="0.10"/>
      <text x="682" y="265.5" text-anchor="middle">Win32 遮挡自动暂停</text>

      <rect x="784" y="246" width="190" height="30" rx="15" fill="#0f172a" fill-opacity="0.05" stroke="#0f172a" stroke-opacity="0.10"/>
      <text x="879" y="265.5" text-anchor="middle">零改原文件 · 一键还原</text>
    </g>
  </g>
  <rect x="0.6" y="0.6" width="1198.8" height="338.8" rx="22" fill="none" stroke="#0f172a" stroke-opacity="0.10" stroke-width="1.2"/>
